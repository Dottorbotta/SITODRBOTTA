name: Website quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build and verify content, routes and metadata
        run: pnpm test
      - name: Verify editorial checker
        run: python3 tests/editorial-audit.test.py
      - name: Audit editorial data and rendered pages
        run: pnpm run editorial:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-report-${{ github.sha }}
          path: editorial-report
          retention-days: 14
          if-no-files-found: warn
      - name: Lighthouse mobile (three runs per URL)
        run: pnpm exec lhci autorun
      - name: Summarize Lighthouse results
        if: always()
        run: node scripts/lighthouse-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
