<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title"><title id="title">Non solo sgonfiare. Tornare capace. Progressione quando il movimento è indicato.</title><rect width="1080" height="1350" fill="#2e160f"/><g font-family="Arial,sans-serif"><text x="80" y="90" fill="#f5823e" font-size="26" letter-spacing="3">METODO CORPO CAPACE</text><text x="80" y="180" fill="#fffcf7" font-size="58" font-weight="bold">NON SOLO SGONFIARE.</text><text x="80" y="255" fill="#f5823e" font-size="58" font-weight="bold">TORNARE CAPACE.</text><text x="80" y="325" fill="#f5e8d8" font-size="28">Prima la valutazione della causa.</text><text x="80" y="368" fill="#f5e8d8" font-size="28">Poi, quando il movimento è indicato:</text><path d="M112 457V1130" stroke="#c65a2a" stroke-width="5"/><g fill="#f5823e"><circle cx="112" cy="460" r="15"/><circle cx="112" cy="585" r="15"/><circle cx="112" cy="710" r="15"/><circle cx="112" cy="835" r="15"/><circle cx="112" cy="960" r="15"/><circle cx="112" cy="1085" r="15"/></g><g fill="#fffcf7" font-size="35" font-weight="bold"><text x="160" y="472">MENO IMMOBILITÀ PROLUNGATA</text><text x="160" y="597">MOVIMENTO DISTRIBUITO</text><text x="160" y="722">CAMMINO GRADUALE</text><text x="160" y="847">FORZA + RESISTENZA</text><text x="160" y="972">MAGGIORE CAPACITÀ</text><text x="160" y="1097">AUTONOMIA</text></g><text x="80" y="1220" fill="#f5e8d8" font-size="27">Dose e progressione seguono la risposta individuale.</text><text x="80" y="1270" fill="#f5e8d8" font-size="25">Una cornice educativa, non una cura per ogni edema.</text></g></svg>
