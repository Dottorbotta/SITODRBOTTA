<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Stare in piedi non è camminare</title><desc id="desc">Schema funzionale della pompa del polpaccio: la contrazione comprime le vene, le valvole favoriscono il flusso verso il cuore; il rilassamento permette il riempimento.</desc><rect width="1200" height="900" fill="#f5e8d8"/><g font-family="Arial,sans-serif" fill="#2e160f"><text x="65" y="80" font-size="24" letter-spacing="3">CORPO CAPACE · EDUCAZIONE AL MOVIMENTO</text><text x="65" y="155" font-size="48" font-weight="bold">STARE IN PIEDI ≠ CAMMINARE</text><rect x="50" y="210" width="525" height="520" rx="18" fill="#fffcf7"/><rect x="605" y="210" width="545" height="520" rx="18" fill="#fffcf7"/><text x="90" y="270" font-size="32" font-weight="bold">STARE FERMI</text><text x="645" y="270" font-size="32" font-weight="bold">CAMMINARE</text><text x="90" y="322" font-size="26">Poche contrazioni cicliche</text><text x="645" y="322" font-size="26">Contrazione del polpaccio</text><rect x="245" y="365" width="100" height="220" rx="25" fill="#e4d5c6"/><text x="295" y="490" text-anchor="middle" font-size="24" transform="rotate(-90 295 490)">VENA</text><text x="90" y="640" font-size="26">La gravità favorisce</text><text x="90" y="676" font-size="26">l'accumulo verso il basso.</text><rect x="840" y="375" width="65" height="210" rx="22" fill="#c65a2a"/><path d="M750 475h65m-20-15 20 15-20 15M996 475h-65m20-15-20 15 20 15" fill="none" stroke="#2e160f" stroke-width="6"/><path d="M872 445V350m-16 20 16-20 16 20" fill="none" stroke="#c65a2a" stroke-width="7"/><text x="645" y="630" font-size="26">Compressione delle vene</text><text x="645" y="670" font-size="26">→ flusso verso il cuore</text><text x="65" y="790" font-size="26">Le valvole funzionanti limitano il reflusso.</text><text x="65" y="830" font-size="26">Il rilassamento permette alle vene di riempirsi di nuovo.</text><text x="65" y="875" font-size="20">Schema funzionale semplificato · Il movimento non tratta tutte le cause di edema.</text></g></svg>
